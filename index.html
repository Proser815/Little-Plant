<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Pixel Plant</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #ffffff;
      --text-sub: #a0a0a0;
      --border: #333333;
      --accent: #4caf50;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --radius: 12px;
    }

    /* Retro Style Preset Overrides */
    body.style-retro {
      --font-family: 'Press Start 2P', monospace;
      --radius: 0px;
    }

    /* Theme Overrides */
    body.theme-dark {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #ffffff;
      --text-sub: #a0a0a0;
      --border: #333333;
    }

    body.theme-dim {
      --bg: #1f232a;
      --card-bg: #2d3139;
      --text: #e0e0e0;
      --text-sub: #8b929e;
      --border: #3e4451;
    }

    body.theme-bright {
      --bg: #f0f2f5;
      --card-bg: #ffffff;
      --text: #111111;
      --text-sub: #666666;
      --border: #dddddd;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
      transition: background-color 0.2s, color 0.2s;
    }

    /* Compact UI Container */
    .app-card {
      background-color: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      width: 240px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      font-size: 14px;
      padding: 2px;
    }

    /* Pixel Art Container */
    .plant-canvas {
      width: 96px;
      height: 96px;
      image-rendering: pixelated;
      margin: 8px 0;
    }

    /* Minimal Dialogue Box */
    .dialogue {
      font-size: 10px;
      text-align: center;
      color: var(--text-sub);
      min-height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
      line-height: 1.3;
    }

    body.style-retro .dialogue { font-size: 7px; }

    /* Settings Screen Overlay */
    .settings-panel {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--card-bg);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
      overflow-y: auto;
    }

    .hidden { display: none !important; }

    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .setting-label {
      font-size: 9px;
      color: var(--text-sub);
    }
    body.style-retro .setting-label { font-size: 6px; }

    select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 4px;
      font-family: inherit;
      font-size: 10px;
      border-radius: calc(var(--radius) / 2);
    }
    body.style-retro select { font-size: 7px; }
  </style>
</head>
<body class="theme-dark style-retro">

  <div class="app-card">
    <!-- Main Display Screen -->
    <div id="main-screen" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
      <div class="top-bar">
        <span style="font-size: 8px;" id="title-text">PLANT</span>
        <button class="icon-btn" onclick="toggleSettings()">⚙️</button>
      </div>

      <!-- Pixel Canvas Plant Art -->
      <canvas id="plantCanvas" class="plant-canvas" width="16" height="16"></canvas>

      <div class="dialogue" id="dialogue-text">...</div>
    </div>

    <!-- Settings Overlay Screen -->
    <div id="settings-screen" class="settings-panel hidden">
      <div class="top-bar">
        <span style="font-size: 8px;" id="settings-title">SETTINGS</span>
        <button class="icon-btn" onclick="toggleSettings()">✖</button>
      </div>

      <div class="setting-item">
        <label class="setting-label" id="label-lang">LANGUAGE</label>
        <select id="select-lang" onchange="updateLanguage(this.value)">
          <option value="en">English</option>
          <option value="zh">中文</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="fa">فارسی</option>
          <option value="it">Italiano</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
        </select>
      </div>

      <div class="setting-item">
        <label class="setting-label" id="label-ui">UI STYLE</label>
        <select id="select-ui" onchange="updateStyle(this.value)">
          <option value="style-retro">Retro (Pixel)</option>
          <option value="style-modern">Modern</option>
        </select>
      </div>

      <div class="setting-item">
        <label class="setting-label" id="label-theme">THEME</label>
        <select id="select-theme" onchange="updateTheme(this.value)">
          <option value="theme-dark">Dark</option>
          <option value="theme-dim">Dim</option>
          <option value="theme-bright">Bright</option>
        </select>
      </div>
    </div>
  </div>

  <script>
    // Localization Data
    const i18n = {
      en: { title: "PLANT", settings: "SETTINGS", lang: "LANGUAGE", ui: "UI STYLE", theme: "THEME", msg: "Growing quietly..." },
      zh: { title: "小植物", settings: "设置", lang: "语言", ui: "UI 风格", theme: "主题", msg: "正在安静地生长..." },
      ja: { title: "ピクセル植物", settings: "設定", lang: "言語", ui: "UIスタイル", theme: "テーマ", msg: "静かに成長中..." },
      ko: { title: "픽셀 식물", settings: "설정", lang: "언어", ui: "UI 스타일", theme: "테마", msg: "조용히 자라는 중..." },
      fa: { title: "گیاه پیکسل", settings: "تنظیمات", lang: "زبان", ui: "سبک رابط", theme: "تم", msg: "در حال رشد..." },
      it: { title: "PIANTA", settings: "IMPOSTAZIONI", lang: "LINGUA", ui: "STILE UI", theme: "TEMA", msg: "Crescendo in silenzio..." },
      de: { title: "PFLANZE", settings: "EINSTELLUNGEN", lang: "SPRACHE", ui: "UI STIL", theme: "THEMA", msg: "Wächst leise..." },
      es: { title: "PLANTA", settings: "AJUSTES", lang: "IDIOMA", ui: "ESTILO UI", theme: "TEMA", msg: "Creciendo en silencio..." },
      fr: { title: "PLANTE", settings: "RÉGLAGES", lang: "LANGUE", ui: "STYLE UI", theme: "THÈME", msg: "Pousse doucement..." }
    };

    let currentLang = 'en';

    function toggleSettings() {
      document.getElementById('settings-screen').classList.toggle('hidden');
    }

    function updateLanguage(lang) {
      currentLang = lang;
      const t = i18n[lang] || i18n.en;
      document.getElementById('title-text').textContent = t.title;
      document.getElementById('settings-title').textContent = t.settings;
      document.getElementById('label-lang').textContent = t.lang;
      document.getElementById('label-ui').textContent = t.ui;
      document.getElementById('label-theme').textContent = t.theme;
      document.getElementById('dialogue-text').textContent = t.msg;

      // Handle RTL for Persian
      document.body.dir = lang === 'fa' ? 'rtl' : 'ltr';
    }

    function updateStyle(styleClass) {
      document.body.classList.remove('style-retro', 'style-modern');
      document.body.classList.add(styleClass);
    }

    function updateTheme(themeClass) {
      document.body.classList.remove('theme-dark', 'theme-dim', 'theme-bright');
      document.body.classList.add(themeClass);
    }

    // Render Procedural Pixel Art Plant
    function drawPixelPlant() {
      const canvas = document.getElementById('plantCanvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 16, 16);

      // Pot (Brown Pixel Art)
      ctx.fillStyle = '#8b4513';
      ctx.fillRect(5, 11, 6, 4);
      ctx.fillStyle = '#a0522d';
      ctx.fillRect(4, 10, 8, 1);

      // Stem (Green)
      ctx.fillStyle = '#2e7d32';
      ctx.fillRect(7, 5, 2, 5);

      // Leaves (Lighter Green)
      ctx.fillStyle = '#4caf50';
      ctx.fillRect(5, 6, 2, 2);
      ctx.fillRect(9, 7, 2, 2);
      ctx.fillRect(7, 3, 2, 2);

      // Highlights
      ctx.fillStyle = '#81c784';
      ctx.fillRect(5, 6, 1, 1);
      ctx.fillRect(7, 3, 1, 1);
    }

    // Initialize
    drawPixelPlant();
    updateLanguage('en');
  </script>
</body>
</html>
