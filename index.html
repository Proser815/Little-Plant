<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Companion</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #1a1c23;
      --card-bg: #252836;
      --text-color: #e2e8f0;
      --accent-color: #5b6ee1;
      --border-color: #4a526d;
      --bubble-user: #3b4252;
      --bubble-bot: #2e3440;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Press Start 2P', monospace;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-size: 9px;
      line-height: 1.6;
    }

    .game-box {
      background-color: var(--card-bg);
      border: 4px solid var(--border-color);
      width: 100%;
      max-width: 360px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 0 #000;
    }

    .title {
      text-align: center;
      color: #f6c177;
      font-size: 10px;
      margin: 0;
    }

    .hidden { display: none !important; }

    .char-select {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 10px;
    }

    .char-card {
      border: 2px solid var(--border-color);
      padding: 12px;
      text-align: center;
      cursor: pointer;
      flex: 1;
      background-color: #1e202e;
    }

    .char-card:hover { border-color: #f6c177; }
    .char-avatar { font-size: 32px; margin-bottom: 8px; }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      border-bottom: 2px dashed var(--border-color);
      padding-bottom: 8px;
    }

    .avatar-display {
      font-size: 48px;
      text-align: center;
      margin: 10px 0;
      animation: idle 2s infinite ease-in-out;
    }

    @keyframes idle {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .chat-box {
      background-color: #1e202e;
      border: 2px solid var(--border-color);
      height: 150px;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg {
      max-width: 85%;
      padding: 6px 8px;
      border-radius: 4px;
    }
    .msg.bot { background-color: var(--bubble-bot); color: #9ccfd8; align-self: flex-start; }
    .msg.user { background-color: var(--bubble-user); color: #f6c177; align-self: flex-end; text-align: right; }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .opt-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      background-color: #1e202e;
      color: var(--text-color);
      border: 2px solid var(--border-color);
      padding: 8px;
      cursor: pointer;
      text-align: left;
    }

    .opt-btn:hover {
      border-color: #f6c177;
      background-color: #2a2d3d;
    }
  </style>
</head>
<body>

  <div class="game-box">
    <h1 class="title">PIXEL COMPANION</h1>

    <div id="selection-screen">
      <p style="text-align: center;">Choose your buddy:</p>
      <div class="char-select">
        <div class="char-card" onclick="selectChar('Sprout', '🌱')">
          <div class="char-avatar">🌱</div>
          <div>PLANT</div>
        </div>
        <div class="char-card" onclick="selectChar('Pebble', '🐱')">
          <div class="char-avatar">🐱</div>
          <div>ANIMAL</div>
        </div>
      </div>
    </div>

    <div id="game-screen" class="hidden">
      <div class="stats-bar">
        <span id="char-name">BUDDY</span>
        <span>DAY <span id="streak">1</span> 🌟</span>
      </div>

      <div class="avatar-display" id="char-sprite">🌱</div>

      <div class="chat-box" id="chat-box"></div>

      <div class="options-grid" id="options-box"></div>
    </div>
  </div>

  <script>
    let companion = { name: '', sprite: '' };

    const dialogues = {
      start: {
        text: "Hey! Glad you checked in today. How are you feeling?",
        options: [
          { label: "Feeling good and productive!", next: "good" },
          { label: "A bit overwhelmed today...", next: "overwhelmed" },
          { label: "Just tired, honestly.", next: "tired" }
        ]
      },
      good: {
        text: "Love to hear that! Keep that energy going. Did you finish a big task?",
        options: [
          { label: "Yeah, crossed off something key!", next: "win" },
          { label: "Just taking it steady step by step.", next: "steady" }
        ]
      },
      overwhelmed: {
        text: "I get it. Take a deep breath. Remember to break things into smaller steps.",
        options: [
          { label: "Thanks, I'll try taking a quick break.", next: "break" },
          { label: "I'll push through slowly.", next: "steady" }
        ]
      },
      tired: {
        text: "Rest is just as important as working hard. Make sure to hydrate!",
        options: [
          { label: "Will do. Thanks for checking on me.", next: "end" },
          { label: "Heading off to recharge now.", next: "end" }
        ]
      },
      win: {
        text: "Nice work! Celebrating small wins makes all the difference.",
        options: [
          { label: "Catch you later!", next: "end" }
        ]
      },
      steady: {
        text: "Steady progress is still progress. You've got this!",
        options: [
          { label: "Thanks buddy, talk soon!", next: "end" }
        ]
      },
      break: {
        text: "Enjoy your rest! I'll be right here when you get back.",
        options: [
          { label: "See ya!", next: "end" }
        ]
      },
      end: {
        text: "See you tomorrow! Keep up the good work! ✨",
        options: []
      }
    };

    function selectChar(name, sprite) {
      companion.name = name;
      companion.sprite = sprite;
      document.getElementById('char-name').textContent = name.toUpperCase();
      document.getElementById('char-sprite').textContent = sprite;

      document.getElementById('selection-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');

      loadDialogue('start');
    }

    function addMessage(text, sender) {
      const chatBox = document.getElementById('chat-box');
      const msg = document.createElement('div');
      msg.className = `msg ${sender}`;
      msg.textContent = sender === 'bot' ? `${companion.sprite} ${text}` : text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function loadDialogue(key) {
      const node = dialogues[key];
      addMessage(node.text, 'bot');

      const optionsBox = document.getElementById('options-box');
      optionsBox.innerHTML = '';

      node.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.textContent = `> ${opt.label}`;
        btn.onclick = () => {
          addMessage(opt.label, 'user');
          optionsBox.innerHTML = '';
          setTimeout(() => loadDialogue(opt.next), 500);
        };
        optionsBox.appendChild(btn);
      });
    }
  </script>
</body>
</html>
