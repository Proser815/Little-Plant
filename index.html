<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Pixel Plant</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+JP:wght@500;700&family=Noto+Sans+KR:wght@500;700&family=Noto+Sans+SC:wght@500;700&family=Vazirmatn:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #ffffff;
      --text-sub: #a0a0a0;
      --border: #333333;
      --accent: #4caf50;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-pixel: 'Press Start 2P', monospace;
      --font-cjk: 'Noto Sans SC', 'Noto Sans JP', 'Noto Sans KR', 'Vazirmatn', -apple-system, sans-serif;
      --radius: 12px;
      --title-size: 10px;
      --dialogue-size: 11px;
      --ui-size: 10px;
    }

    body.style-retro {
      --font-family: var(--font-pixel);
      --radius: 0px;
      --title-size: 8px;
      --dialogue-size: 7px;
      --ui-size: 7px;
    }

    body.lang-cjk.style-retro,
    body.lang-rtl.style-retro {
      --font-family: var(--font-cjk);
      --title-size: 11px;
      --dialogue-size: 11px;
      --ui-size: 10px;
    }

    body.theme-dark {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #ffffff;
      --text-sub: #a0a0a0;
      --border: #333333;
    }

    body.theme-dim {
      --bg: #1f232a;
      --card-bg: #2d3139;
      --text: #e0e0e0;
      --text-sub: #8b929e;
      --border: #3e4451;
    }

    body.theme-bright {
      --bg: #f0f2f5;
      --card-bg: #ffffff;
      --text: #111111;
      --text-sub: #666666;
      --border: #dddddd;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
      transition: background-color 0.2s, color 0.2s;
    }

    .app-card {
      background-color: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      width: 240px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .top-title {
      font-size: var(--title-size);
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      font-size: 14px;
      padding: 2px;
    }

    /* Plant canvas with CSS smooth transition */
    .plant-canvas {
      width: 96px;
      height: 96px;
      image-rendering: pixelated;
      margin: 4px 0;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .plant-canvas.morphing {
      opacity: 0.3;
      transform: scale(0.85);
    }

    .dialogue {
      font-size: var(--dialogue-size);
      text-align: center;
      color: var(--text-sub);
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
      line-height: 1.3;
      font-weight: 500;
      padding: 0 4px;
    }

    .status-tracker {
      font-size: calc(var(--ui-size) - 1px);
      color: var(--text-sub);
      margin-top: 4px;
      display: flex;
      gap: 8px;
    }

    .mood-bar {
      display: flex;
      gap: 4px;
      margin-top: 6px;
      justify-content: center;
      width: 100%;
    }

    .mood-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) / 2);
      padding: 4px;
      font-size: 12px;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.2s;
    }

    .mood-btn:active { transform: scale(0.9); }
    .mood-btn.selected { border-color: var(--accent); background: var(--border); }
    .mood-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .overlay-panel {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--card-bg);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
      overflow-y: auto;
    }

    .hidden { display: none !important; }

    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .setting-label {
      font-size: var(--ui-size);
      color: var(--text-sub);
      font-weight: 500;
    }

    input[type="text"], select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 4px 6px;
      font-family: var(--font-family);
      font-size: var(--ui-size);
      border-radius: calc(var(--radius) / 2);
    }

    .btn-primary {
      background-color: var(--accent);
      color: #fff;
      border: none;
      padding: 6px;
      font-family: var(--font-family);
      font-size: var(--ui-size);
      border-radius: calc(var(--radius) / 2);
      cursor: pointer;
      margin-top: 4px;
    }

    .instructions-box {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: calc(var(--radius) / 2);
      font-size: calc(var(--ui-size) - 1px);
      line-height: 1.4;
      color: var(--text-sub);
    }
  </style>
</head>
<body class="theme-dark style-retro lang-latin">

  <div class="app-card">
    <div id="naming-screen" class="overlay-panel">
      <div class="top-bar">
        <span class="top-title" id="welcome-title">WELCOME</span>
      </div>
      <div class="setting-item" style="margin-top: 10px;">
        <label class="setting-label" id="label-name-plant">NAME YOUR PLANT</label>
        <input type="text" id="initial-name-input" placeholder="Sprout" maxlength="12">
      </div>
      <button class="btn-primary" onclick="saveInitialName()" id="btn-start">START</button>
    </div>

    <div id="main-screen" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
      <div class="top-bar">
        <span class="top-title" id="plant-display-name">PLANT</span>
        <button class="icon-btn" onclick="toggleSettings()">⚙️</button>
      </div>

      <canvas id="plantCanvas" class="plant-canvas" width="16" height="16" onclick="petPlant()"></canvas>

      <div class="dialogue" id="dialogue-text">...</div>

      <div class="status-tracker">
        <span id="stage-text">STAGE 1</span> | 
        <span id="chances-text">CHANCES: 4/4</span>
      </div>

      <div class="mood-bar">
        <button class="mood-btn" id="mbtn-happy" onclick="logMood('happy', 3)" title="Happy">😊</button>
        <button class="mood-btn" id="mbtn-calm" onclick="logMood('calm', 2)" title="Calm">😌</button>
        <button class="mood-btn" id="mbtn-tired" onclick="logMood('tired', 1)" title="Tired">😴</button>
        <button class="mood-btn" id="mbtn-sad" onclick="logMood('sad', 0)" title="Sad">🌧️</button>
      </div>
    </div>

    <div id="settings-screen" class="overlay-panel hidden">
      <div class="top-bar">
        <span class="top-title" id="settings-title">SETTINGS</span>
        <button class="icon-btn" onclick="toggleSettings()">✖</button>
      </div>

      <div class="setting-item">
        <label class="setting-label" id="label-edit-name">PLANT NAME</label>
        <input type="text" id="edit-name-input" maxlength="12" onchange="updatePlantName(this.value)">
      </div>

      <div class="setting-item">
        <label class="setting-label" id="label-lang">LANGUAGE</label>
        <select id="select-lang" onchange="updateLanguage(this.value)">
          <option value="en">English</option>
          <option value="zh">中文</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="fa">فارسی</option>
          <option value="it">Italiano</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
        </select>
      </div>

      <div class="setting-item">
        <label class="setting-label" id="label-ui">UI STYLE</label>
        <select id="select-ui" onchange="updateStyle(this.value)">
          <option value="style-retro">Retro (Pixel)</option>
          <option value="style-modern">Modern</option>
        </select>
      </div>

      <div class="setting-item">
        <label class="setting-label" id="label-theme">THEME</label>
        <select id="select-theme" onchange="updateTheme(this.value)">
          <option value="theme-dark">Dark</option>
          <option value="theme-dim">Dim</option>
          <option value="theme-bright">Bright</option>
        </select>
      </div>

      <button class="btn-primary" onclick="toggleInstructions()" id="btn-how-to">HOW IT WORKS</button>
      <div id="instructions-box" class="instructions-box hidden"></div>
    </div>
  </div>

    let currentLang = 'en';
    let plantName = 'Sprout';
    let currentMood = 'happy';
    let chancesLeft = 4;
    let moodScores = [];
    let growthStage = 1;

    function saveInitialName() {
      const input = document.getElementById('initial-name-input').value.trim();
      if (input) plantName = input;
      document.getElementById('edit-name-input').value = plantName;
      document.getElementById('plant-display-name').textContent = plantName;
      document.getElementById('naming-screen').classList.add('hidden');
      updateDialogue();
      updateTrackerUI();
    }

    function updatePlantName(newName) {
      if (newName.trim()) {
        plantName = newName.trim();
        document.getElementById('plant-display-name').textContent = plantName;
        updateDialogue();
      }
    }

    function toggleSettings() {
      document.getElementById('settings-screen').classList.toggle('hidden');
    }

    function toggleInstructions() {
      document.getElementById('instructions-box').classList.toggle('hidden');
    }

    function logMood(mood, score) {
      if (chancesLeft <= 0) return;

      currentMood = mood;
      chancesLeft--;
      moodScores.push(score);

      // Smooth state transition animation
      const canvas = document.getElementById('plantCanvas');
      canvas.classList.add('morphing');
      
      setTimeout(() => {
        drawPixelPlant();
        canvas.classList.remove('morphing');
      }, 200);

      document.querySelectorAll('.mood-btn').forEach(btn => btn.classList.remove('selected'));
      document.getElementById(`mbtn-${mood}`).classList.add('selected');

      if (chancesLeft === 0) {
        summarizeDailyMood();
      } else {
        updateDialogue();
      }

      updateTrackerUI();
    }

    function summarizeDailyMood() {
      const avg = moodScores.reduce((a, b) => a + b, 0) / moodScores.length;
      if (avg >= 2 && growthStage < 3) {
        growthStage++;
      }
      
      const t = i18n[currentLang] || i18n.en;
      let summaryLabel = avg >= 2.25 ? "😊" : avg >= 1.5 ? "😌" : avg >= 0.75 ? "😴" : "🌧️";
      document.getElementById('dialogue-text').textContent = `${t.summary} ${summaryLabel}. ${t.noChances}`;
      
      // Disable buttons when chances run out
      document.querySelectorAll('.mood-btn').forEach(btn => btn.disabled = true);
      drawPixelPlant();
    }

    function updateTrackerUI() {
      const t = i18n[currentLang] || i18n.en;
      document.getElementById('stage-text').textContent = `${t.stage} ${growthStage}`;
      document.getElementById('chances-text').textContent = `${t.chances}: ${chancesLeft}/4`;
    }

    function updateDialogue() {
      const t = i18n[currentLang] || i18n.en;
      const moodText = t.moods[currentMood];
      document.getElementById('dialogue-text').textContent = `${plantName} ${moodText}`;
    }

    function updateLanguage(lang) {
      currentLang = lang;
      const t = i18n[lang] || i18n.en;

      document.body.classList.remove('lang-cjk', 'lang-rtl', 'lang-latin');
      if (['zh', 'ja', 'ko'].includes(lang)) {
        document.body.classList.add('lang-cjk');
      } else if (lang === 'fa') {
        document.body.classList.add('lang-rtl');
      } else {
        document.body.classList.add('lang-latin');
      }

      document.getElementById('welcome-title').textContent = t.welcome;
      document.getElementById('btn-start').textContent = t.start;
      document.getElementById('label-name-plant').textContent = t.namePlant;
      document.getElementById('label-edit-name').textContent = t.editName;
      document.getElementById('settings-title').textContent = t.settings;
      document.getElementById('label-lang').textContent = t.lang;
      document.getElementById('label-ui').textContent = t.ui;
      document.getElementById('label-theme').textContent = t.theme;
      document.getElementById('btn-how-to').textContent = t.howTo;
      document.getElementById('instructions-box').textContent = t.instructions;

      document.body.dir = lang === 'fa' ? 'rtl' : 'ltr';
      
      if (chancesLeft > 0) updateDialogue();
      updateTrackerUI();
    }

    function updateStyle(styleClass) {
      document.body.classList.remove('style-retro', 'style-modern');
      document.body.classList.add(styleClass);
    }

    function updateTheme(themeClass) {
      document.body.classList.remove('theme-dark', 'theme-dim', 'theme-bright');
      document.body.classList.add(themeClass);
    }

    function petPlant() {
      const canvas = document.getElementById('plantCanvas');
      canvas.style.transform = 'scale(1.15)';
      setTimeout(() => canvas.style.transform = 'scale(1)', 150);
    }

    function drawPixelPlant() {
      const canvas = document.getElementById('plantCanvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 16, 16);

      // Pot
      ctx.fillStyle = '#8b4513';
      ctx.fillRect(5, 11, 6, 4);
      ctx.fillStyle = '#a0522d';
      ctx.fillRect(4, 10, 8, 1);

      // Stem (Grows higher based on growthStage)
      ctx.fillStyle = currentMood === 'sad' ? '#4a7c59' : '#2e7d32';
      const stemHeight = growthStage === 1 ? 3 : growthStage === 2 ? 5 : 7;
      const startY = 10 - stemHeight;

      if (currentMood === 'tired' || currentMood === 'sad') {
        ctx.fillRect(7, startY + 2, 2, stemHeight - 1);
        ctx.fillRect(6, startY, 2, 2);
      } else {
        ctx.fillRect(7, startY, 2, stemHeight);
      }

      // Leaves
      const leafColors = { happy: '#4caf50', calm: '#66bb6a', tired: '#81c784', sad: '#5c8a67' };
      ctx.fillStyle = leafColors[currentMood];

      if (currentMood === 'happy' || currentMood === 'calm') {
        ctx.fillRect(5, startY + 2, 2, 2);
        ctx.fillRect(9, startY + 3, 2, 2);
        if (growthStage >= 2) {
          ctx.fillRect(4, startY + 4, 2, 2);
          ctx.fillRect(10, startY + 5, 2, 2);
        }
        if (currentMood === 'happy') {
          ctx.fillStyle = '#f48fb1';
          ctx.fillRect(7, startY - 1, 2, 1); // Flower bloom
        }
      } else {
        ctx.fillRect(4, startY + 3, 2, 2);
        ctx.fillRect(8, startY + 4, 2, 2);
      }
    }

    drawPixelPlant();
    updateLanguage('en');
  </script>
</body>
