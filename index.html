<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Pal - Retro iOS Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --ios-bg-glass: rgba(30, 32, 48, 0.75);
      --ios-card-glass: rgba(255, 255, 255, 0.08);
      --ios-border: rgba(255, 255, 255, 0.15);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-pixel: #a7f3d0;
      --accent-orange: #fbbf24;
      --accent-pink: #f472b6;
      --accent-blue: #60a5fa;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Press Start 2P', monospace;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: var(--text-main);
      margin: 0;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-size: 8px;
      line-height: 1.6;
    }

    /* iOS Glassmorphism Container */
    .app-card {
      background: var(--ios-bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--ios-border);
      border-radius: 28px;
      width: 100%;
      max-width: 360px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Top Status Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .badge {
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 8px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .hidden { display: none !important; }

    /* Character Selection */
    .selection-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .char-card {
      background: var(--ios-card-glass);
      border: 1px solid var(--ios-border);
      border-radius: 18px;
      padding: 16px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .char-card:active {
      transform: scale(0.94);
    }

    .char-avatar {
      font-size: 36px;
      margin-bottom: 8px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    }

    /* Stats Grid */
    .stats-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .stat-box {
      background: var(--ios-card-glass);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 8px 4px;
      text-align: center;
    }

    .stat-label {
      font-size: 6px;
      color: var(--text-muted);
      margin-bottom: 4px;
      display: block;
    }

    .stat-bar-outer {
      background: rgba(0, 0, 0, 0.3);
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 2px;
    }

    .stat-bar-inner {
      height: 100%;
      background: var(--accent-pixel);
      width: 50%;
      transition: width 0.4s ease;
      border-radius: 3px;
    }

    /* Animated Avatar Stage */
    .stage {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 20px;
      padding: 16px;
      text-align: center;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .sprite-display {
      font-size: 52px;
      display: inline-block;
      animation: float 3s infinite ease-in-out;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.4));
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .sprite-display:active {
      transform: scale(1.2) rotate(5deg);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    /* Action Widget Buttons */
    .action-row {
      display: flex;
      gap: 6px;
      justify-content: center;
    }

    .action-btn {
      flex: 1;
      background: var(--ios-card-glass);
      border: 1px solid var(--ios-border);
      color: var(--text-main);
      padding: 8px 4px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 7px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .action-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.18);
    }

    /* Chat Section */
    .chat-box {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      height: 120px;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
    }

    .chat-box::-webkit-scrollbar {
      width: 4px;
    }
    .chat-box::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
    }

    .msg {
      max-width: 88%;
      padding: 8px 10px;
      border-radius: 12px;
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      word-break: break-word;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.bot {
      background: rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .msg.user {
      background: #3b82f6;
      color: #ffffff;
      align-self: flex-end;
      text-align: right;
      border-bottom-right-radius: 4px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .opt-btn {
      font-family: inherit;
      font-size: 7px;
      background: var(--ios-card-glass);
      color: var(--text-main);
      border: 1px solid var(--ios-border);
      padding: 10px;
      border-radius: 12px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .opt-btn:active {
      transform: scale(0.97);
      background: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>

  <div class="app-card">
    <!-- Header -->
    <div class="status-bar">
      <span style="color: var(--accent-orange);">PIXEL PAL</span>
      <span class="badge" id="streak-badge">DAY 1 🔥</span>
    </div>

    <!-- Screen 1: Selection -->
    <div id="selection-screen">
      <p style="text-align: center; margin: 12px 0; color: var(--text-muted);">SELECT YOUR COMPANION</p>
      <div class="selection-grid">
        <div class="char-card" onclick="selectChar('Sprout', '🌱')">
          <div class="char-avatar">🌱</div>
          <div style="color: var(--accent-pixel);">PLANT</div>
        </div>
        <div class="char-card" onclick="selectChar('Pebble', '🦊')">
          <div class="char-avatar">🦊</div>
          <div style="color: var(--accent-orange);">ANIMAL</div>
        </div>
      </div>
    </div>

    <!-- Screen 2: Main App -->
    <div id="game-screen" class="hidden">
      <!-- Status Stats -->
      <div class="stats-container">
        <div class="stat-box">
          <span class="stat-label">MOOD</span>
          <span id="stat-mood">HAPPY</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">ENERGY</span>
          <div class="stat-bar-outer">
            <div class="stat-bar-inner" id="energy-bar" style="width: 80%;"></div>
          </div>
        </div>
        <div class="stat-box">
          <span class="stat-label">BOND</span>
          <div class="stat-bar-outer">
            <div class="stat-bar-inner" id="bond-bar" style="width: 40%; background: var(--accent-pink);"></div>
          </div>
        </div>
      </div>

      <!-- Avatar Stage -->
      <div class="stage">
        <div class="sprite-display" id="char-sprite" onclick="petBuddy()">🌱</div>
      </div>

      <!-- Functional Actions -->
      <div class="action-row">
        <button class="action-btn" onclick="feedBuddy()">
          <span>🍎</span>
          <span>FEED</span>
        </button>
        <button class="action-btn" onclick="triggerMiniTask()">
          <span>⏱️</span>
          <span>FOCUS</span>
        </button>
        <button class="action-btn" onclick="logWater()">
          <span>💧</span>
          <span>HYDRATE</span>
        </button>
      </div>

      <!-- Dialogue Log -->
      <div class="chat-box" id="chat-box"></div>

      <!-- Dynamic Response Options -->
      <div class="options-grid" id="options-box"></div>
    </div>
  </div>

  <script>
    let companion = { name: '', sprite: '', energy: 80, bond: 40, streak: 1 };

    const dialogues = {
      start: {
        text: "Hey! Glad you checked in today. How are you feeling right now?",
        options: [
          { label: "Good & ready to lock in!", next: "good" },
          { label: "Feeling a bit drained...", next: "tired" },
          { label: "Stressed about my tasks.", next: "stressed" }
        ]
      },
      good: {
        text: "Awesome energy! Want to do a quick 5-min focus session with me?",
        options: [
          { label: "Let's do it! Start timer.", action: "focus" },
          { label: "Just chatting today.", next: "chat" }
        ]
      },
      tired: {
        text: "I hear you. Don't forget to take a sip of water and rest your eyes.",
        options: [
          { label: "Hydrate together 💧", action: "hydrate" },
          { label: "I'll take it easy.", next: "chat" }
        ]
      },
      stressed: {
        text: "Take a deep breath. We can tackle things one small step at a time.",
        options: [
          { label: "Thanks buddy, feeling better.", next: "chat" }
        ]
      },
      chat: {
        text: "I'm always chilling right here on your page whenever you need me! ✨",
        options: [
          { label: "Reset Dialogue", next: "start" }
        ]
      }
    };

    function selectChar(name, sprite) {
      companion.name = name;
      companion.sprite = sprite;
      document.getElementById('char-sprite').textContent = sprite;

      document.getElementById('selection-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');

      loadDialogue('start');
    }

    function addMessage(text, sender) {
      const chatBox = document.getElementById('chat-box');
      const msg = document.createElement('div');
      msg.className = `msg ${sender}`;
      msg.textContent = sender === 'bot' ? `${companion.sprite} ${text}` : text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function loadDialogue(key) {
      const node = dialogues[key];
      if (!node) return;

      addMessage(node.text, 'bot');

      const optionsBox = document.getElementById('options-box');
      optionsBox.innerHTML = '';

      node.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.textContent = opt.label;
        btn.onclick = () => {
          addMessage(opt.label, 'user');
          optionsBox.innerHTML = '';
          setTimeout(() => {
            if (opt.action === 'focus') triggerMiniTask();
            else if (opt.action === 'hydrate') logWater();
            else if (opt.next) loadDialogue(opt.next);
          }, 400);
        };
        optionsBox.appendChild(btn);
      });
    }

    /* Extra Game Functions */
    function petBuddy() {
      companion.bond = Math.min(100, companion.bond + 10);
      document.getElementById('bond-bar').style.width = companion.bond + '%';
      addMessage("*Happy pixel sounds!* (+10 Bond)", 'bot');
    }

    function feedBuddy() {
      companion.energy = Math.min(100, companion.energy + 15);
      document.getElementById('energy-bar').style.width = companion.energy + '%';
      addMessage("Yum! Thanks for the snack! (+15 Energy)", 'bot');
    }

    function logWater() {
      petBuddy();
      addMessage("Gulp gulp... Stay hydrated! (+10 Bond)", 'bot');
    }

    function triggerMiniTask() {
      addMessage("Starting 5-minute focus mode! Stay on task...", 'bot');
      let seconds = 5 * 60;
      const optionsBox = document.getElementById('options-box');
      optionsBox.innerHTML = `<div style="text-align:center; padding: 8px; color: var(--accent-orange);" id="timer-display">05:00</div>`;

      const interval = setInterval(() => {
        seconds--;
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        const timerEl = document.getElementById('timer-display');
        if (timerEl) timerEl.textContent = `${m}:${s}`;

        if (seconds <= 0) {
          clearInterval(interval);
          addMessage("Focus session complete! Great work! 🎉", 'bot');
          loadDialogue('chat');
        }
      }, 1000);
    }
  </script>
</body>
</html>
